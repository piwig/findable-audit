# Publish packages/cli to npm when a v* tag is pushed.
#
# Authentication is OIDC trusted publishing — there is NO npm token anywhere in
# this repository. The package's "Trusted Publisher" setting on npmjs.com names
# this repo (piwig/findable-audit) and this file (release.yml); npm accepts a
# publish only when the OIDC claims match. Rename this file and publishing stops
# working until the npm side is updated to match.
#
# Provenance comes for free: publishing over OIDC from a public repo records
# which workflow, commit and runner produced the tarball, and npm shows the
# "Built and signed on GitHub Actions" badge. No --provenance flag needed.
#
# Release flow:
#   npm version <patch|minor|major> --workspace packages/cli   # bumps + commits
#   git tag v$(node -p "require('./packages/cli/package.json').version")
#   git push && git push --tags
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # the critical requirement: it is what mints the OIDC token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; Node 24 ships an older npm, so
      # pin the CLI itself rather than hoping the runner image is recent enough.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build --workspaces
      - run: npm test --workspaces

      # The tag must match the version being published: a mismatched tag would
      # publish a version nobody can check out.
      - name: Tag matches packages/cli version
        run: |
          PKG=$(node -p "require('./packages/cli/package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "tag $GITHUB_REF_NAME does not match packages/cli version $PKG" >&2
            exit 1
          fi

      # Publishing is irreversible, so the tarball is inspected BEFORE it goes
      # out. `files` only ships `dist`, which means a publish that skipped the
      # build would upload a package with no code in it and nobody would notice
      # until an install failed.
      - name: The tarball actually contains the CLI
        run: |
          npm pack --dry-run --json --workspace packages/cli > /tmp/pack.json
          node -e '
            const pack = require("/tmp/pack.json")[0];
            const names = pack.files.map((f) => f.path);
            const required = ["dist/index.js", "dist/checks/index.js", "README.md", "LICENSE"];
            const missing = required.filter((f) => !names.includes(f));
            if (missing.length) {
              console.error("tarball is missing: " + missing.join(", "));
              process.exit(1);
            }
            if (names.length < 50) {
              console.error(`tarball has only ${names.length} files — a partial build?`);
              process.exit(1);
            }
            console.log(`tarball ok: ${names.length} files, ${(pack.size / 1024).toFixed(0)} kB`);
          '

      # No NODE_AUTH_TOKEN: the package's trusted publisher (npmjs.com > package
      # settings) authorizes this exact repo + workflow over OIDC. Provenance is
      # generated automatically, so --provenance is not passed either.
      - run: npm publish --access public --workspace packages/cli

  # What the tests above never touch: the artefact that actually reaches users.
  # Everything before this point runs against the checkout. This installs the
  # published package from the registry, on both platforms we claim to support,
  # and runs it — the six releases before this job existed were verified by hand,
  # which is the kind of step that gets skipped exactly once.
  smoke:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the published version and run it
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The registry needs a moment to serve a brand-new version.
          for i in 1 2 3 4 5 6; do
            if npm view "findable-audit@$VERSION" version >/dev/null 2>&1; then break; fi
            echo "waiting for findable-audit@$VERSION to appear on the registry ($i)"
            sleep 10
          done
          OUT=$(npx -y "findable-audit@$VERSION" --version)
          echo "installed: $OUT"
          [ "$OUT" = "$VERSION" ] || { echo "--version printed '$OUT', expected '$VERSION'" >&2; exit 1; }
          npx -y "findable-audit@$VERSION" --help | grep -q "Usage: findable" || { echo "--help output unexpected" >&2; exit 1; }

      - name: Audit a real site with the published binary
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Our own site: auditing someone else's from CI on every release would
          # be impolite. A failure here means the published engine is broken, or
          # our own site is down — both are worth a red run.
          npx -y "findable-audit@$VERSION" https://findable.bordebat.fr \
            --max-pages 2 --no-report --json > report.json
          node -e '
            const r = require("./report.json");
            if (typeof r.score !== "number" || !Array.isArray(r.results) || r.results.length < 100) {
              console.error("published binary produced an implausible report", { score: r.score, checks: r.results?.length });
              process.exit(1);
            }
            console.log(`published binary scored ${r.score}/100 (${r.grade}) over ${r.results.length} checks`);
          '
