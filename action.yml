name: 'findable-audit'
description: >-
  SEO & GEO audit gate: score how findable a site is by search engines and AI
  assistants (149 checks, 8 families). Fails the job below min-score or on
  regression vs a baseline; writes SARIF/JUnit/JSON/HTML/Markdown reports.
author: 'piwig'
branding:
  icon: 'search'
  color: 'green'

inputs:
  url:
    description: 'The public http(s) URL to audit.'
    required: true
  min-score:
    description: 'Fail the job when the overall score is below this floor (0-100). Default 0 = never fail on score.'
    required: false
    default: '0'
  max-pages:
    description: 'Max same-origin pages sampled (homepage included). Empty = CLI default.'
    required: false
    default: '5'
  baseline:
    description: 'Path to a prior `--report *.json` audit to diff against (regression gate).'
    required: false
    default: ''
  fail-on-regression:
    description: 'Fail the job when the score drops below the baseline by more than regression-tolerance. Requires baseline.'
    required: false
    default: 'false'
  regression-tolerance:
    description: 'Allowed score drop (points) before fail-on-regression triggers. Empty = 0.'
    required: false
    default: ''
  report:
    description: >-
      Additional report file(s) to write, space-separated; the extension picks
      the format: .md / .html / .json / .sarif / .xml (JUnit) / .svg (status badge).
    required: false
    default: ''
  sarif-file:
    description: 'SARIF file to write (for github/codeql-action/upload-sarif). Empty string to disable.'
    required: false
    default: 'findable-audit.sarif'
  badge:
    description: >-
      Path to write the SVG score badge to (e.g. docs/findable-badge.svg). Commit it and
      point your README at it. Self-contained — no third-party badge service — and its
      <title> carries the audited host and the audit date, so a stale badge says so.
    required: false
    default: ''
  lang:
    description: 'Report chrome language: en or fr.'
    required: false
    default: ''
  allow-cross-version:
    description: >-
      Let fail-on-regression compare against a baseline produced by a different
      findable-audit release. Off by default: a score that moved because OUR
      scoring model changed is not a regression of your site (A128).
    required: false
    default: 'false'
  fail-on:
    description: >-
      Check id(s) that must pass, space-separated (e.g. "https robots-txt").
      Fails the job when any of them does not pass, whatever the score.
    required: false
    default: ''
  format:
    description: 'Force the report format (md, html, json, sarif, junit, svg, shields) regardless of file extension. Empty = by extension.'
    required: false
    default: ''
  emit:
    description: 'Directory to write ready-to-deploy indexing files into (robots.txt, llms.txt, sitemap.xml…). Empty = do not emit.'
    required: false
    default: ''
  cwv:
    description: 'Add the Core Web Vitals check (PageSpeed Insights). Set psi-key to avoid the anonymous quota.'
    required: false
    default: 'false'
  psi-key:
    description: 'PageSpeed Insights API key for cwv. Pass a secret, never a literal.'
    required: false
    default: ''
  quiet:
    description: 'Silence progress output; only the result and errors are printed.'
    required: false
    default: 'false'
  no-color:
    description: 'Disable ANSI colours in the CLI output (the summary is plain text either way).'
    required: false
    default: 'true'
  version:
    description: >-
      findable-audit version to run via `npx findable-audit@<version>`, or
      `local` to build the CLI from this action''s own checkout (default until
      the npm package is published).
    required: false
    default: 'local'

outputs:
  score:
    description: 'Overall score, 0-100.'
    value: ${{ steps.audit.outputs.score }}
  grade:
    description: 'Letter grade, A-F.'
    value: ${{ steps.audit.outputs.grade }}
  json:
    description: 'Path to the full JSON report (usable as the next run''s baseline).'
    value: ${{ steps.audit.outputs.json }}
  sarif-file:
    description: 'Path to the written SARIF report.'
    value: ${{ inputs.sarif-file }}

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Run audit
      id: audit
      shell: bash
      # Inputs flow in via env (never interpolated into the script body) so a
      # crafted input cannot inject shell code.
      env:
        FINDABLE_URL: ${{ inputs.url }}
        FINDABLE_MIN_SCORE: ${{ inputs.min-score }}
        FINDABLE_MAX_PAGES: ${{ inputs.max-pages }}
        FINDABLE_BASELINE: ${{ inputs.baseline }}
        FINDABLE_FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
        FINDABLE_REGRESSION_TOLERANCE: ${{ inputs.regression-tolerance }}
        FINDABLE_REPORT: ${{ inputs.report }}
        FINDABLE_SARIF: ${{ inputs.sarif-file }}
        FINDABLE_BADGE: ${{ inputs.badge }}
        FINDABLE_LANG: ${{ inputs.lang }}
        FINDABLE_VERSION: ${{ inputs.version }}
        FINDABLE_ALLOW_CROSS_VERSION: ${{ inputs.allow-cross-version }}
        FINDABLE_FAIL_ON: ${{ inputs.fail-on }}
        FINDABLE_FORMAT: ${{ inputs.format }}
        FINDABLE_EMIT: ${{ inputs.emit }}
        FINDABLE_CWV: ${{ inputs.cwv }}
        FINDABLE_PSI_KEY: ${{ inputs.psi-key }}
        FINDABLE_QUIET: ${{ inputs.quiet }}
        FINDABLE_NO_COLOR: ${{ inputs.no-color }}
      run: |
        set -u
        if [ "$FINDABLE_VERSION" = "local" ]; then
          # Fallback while the npm package is unpublished: build the CLI from
          # the action's own checkout ($GITHUB_ACTION_PATH = this repo).
          echo "::group::Build findable-audit from the action checkout"
          (cd "$GITHUB_ACTION_PATH" \
            && npm ci --workspaces --include-workspace-root --no-audit --no-fund \
            && npm run build --workspace packages/cli)
          echo "::endgroup::"
          CLI=(node "$GITHUB_ACTION_PATH/packages/cli/dist/index.js")
        else
          CLI=(npx -y "findable-audit@$FINDABLE_VERSION")
        fi

        JSON_OUT="$RUNNER_TEMP/findable.json"
        ARGS=("$FINDABLE_URL" --report "$JSON_OUT" --min-score "$FINDABLE_MIN_SCORE")
        [ -n "$FINDABLE_SARIF" ] && ARGS+=(--report "$FINDABLE_SARIF")
        [ -n "$FINDABLE_BADGE" ] && ARGS+=(--report "$FINDABLE_BADGE")
        for f in $FINDABLE_REPORT; do ARGS+=(--report "$f"); done
        [ -n "$FINDABLE_MAX_PAGES" ] && ARGS+=(--max-pages "$FINDABLE_MAX_PAGES")
        [ -n "$FINDABLE_BASELINE" ] && ARGS+=(--baseline "$FINDABLE_BASELINE")
        [ "$FINDABLE_FAIL_ON_REGRESSION" = "true" ] && ARGS+=(--fail-on-regression)
        [ -n "$FINDABLE_REGRESSION_TOLERANCE" ] && ARGS+=(--regression-tolerance "$FINDABLE_REGRESSION_TOLERANCE")
        [ -n "$FINDABLE_LANG" ] && ARGS+=(--lang "$FINDABLE_LANG")
        # A135 — the options below existed in the CLI but not here; the action is
        # the surface CI users actually touch (test/action-parity.test.ts keeps
        # this list aligned with parseArgs).
        [ "$FINDABLE_ALLOW_CROSS_VERSION" = "true" ] && ARGS+=(--allow-cross-version)
        for id in $FINDABLE_FAIL_ON; do ARGS+=(--fail-on "$id"); done
        [ -n "$FINDABLE_FORMAT" ] && ARGS+=(--format "$FINDABLE_FORMAT")
        [ -n "$FINDABLE_EMIT" ] && ARGS+=(--emit "$FINDABLE_EMIT")
        [ "$FINDABLE_CWV" = "true" ] && ARGS+=(--cwv)
        [ -n "$FINDABLE_PSI_KEY" ] && ARGS+=(--psi-key "$FINDABLE_PSI_KEY")
        [ "$FINDABLE_QUIET" = "true" ] && ARGS+=(--quiet)
        [ "$FINDABLE_NO_COLOR" = "true" ] && ARGS+=(--no-color)

        set +e
        "${CLI[@]}" "${ARGS[@]}"
        CODE=$?
        set -e

        # Expose outputs even when the gate fails (the step still fails below).
        if [ -f "$JSON_OUT" ]; then
          JSON_OUT="$JSON_OUT" node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync(process.env.JSON_OUT, "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `score=${r.score}\ngrade=${r.grade}\njson=${process.env.JSON_OUT}\n`);
            console.log(`findable-audit: ${r.score}/100 (grade ${r.grade})`);
          '
        fi
        exit "$CODE"
